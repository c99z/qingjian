# 青简账号服务：account（Rust 服务，只在容器网络和本机回环可达）+ caddy（HTTPS 入口）。
# 用法见 apps/account-server/README.md；变量在同目录 .env（从 env.example 复制）。
name: qingjian-account

services:
  account:
    build:
      context: ../../..
      dockerfile: apps/account-server/docker/Dockerfile
      args:
        RUST_IMAGE: ${QINGJIAN_RUST_IMAGE:-rust:1.96-slim-trixie}
        RUNTIME_IMAGE: ${QINGJIAN_RUNTIME_IMAGE:-debian:trixie-slim}
    image: ${QINGJIAN_ACCOUNT_IMAGE:-qingjian-account-server:local}
    restart: unless-stopped
    environment:
      QINGJIAN_REGISTRATION: ${QINGJIAN_REGISTRATION:-closed}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - account-data:/data
    # 只发布到本机回环：给本机排查或已有的宿主机反向代理用，外部访问一律走 caddy
    ports:
      - "127.0.0.1:${QINGJIAN_LOCAL_PORT:-9080}:9080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: ${QINGJIAN_CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    depends_on:
      account:
        condition: service_healthy
    environment:
      QINGJIAN_SITE: ${QINGJIAN_SITE:?在 .env 里填写 QINGJIAN_SITE（服务器 IP 或域名）}
      QINGJIAN_EXTRA_SITES: ${QINGJIAN_EXTRA_SITES:-}
      QINGJIAN_TLS: ${QINGJIAN_TLS:-internal}
    ports:
      - "${QINGJIAN_HTTPS_PORT:-443}:443"
      - "${QINGJIAN_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 自建 CA 的根证书与私钥在这里；删了这个卷，客户端要重新信任新的根证书
      - caddy-data:/data
      - caddy-config:/config

volumes:
  account-data:
  caddy-data:
  caddy-config:
